name: Reusable – Build, Test and Publish

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the package to build and publish
        required: true
        type: string
      node-version:
        description: Node.js version to use
        required: false
        default: '20'
        type: string
      registry-url:
        description: npm registry URL for authentication
        required: false
        default: 'https://registry.npmjs.org'
        type: string
      install-command:
        description: Command used to install dependencies
        required: false
        default: 'npm install'
        type: string
      build-command:
        description: Command used to build the package
        required: false
        default: 'npm run build'
        type: string
      test-command:
        description: Command used to run unit tests
        required: false
        default: 'npm test'
        type: string
      package-name:
        description: Optional npm package name (falls back to package.json name if omitted)
        required: false
        type: string
      sync-docs:
        description: Run documentation sync after publish
        required: false
        default: true
        type: boolean
    secrets:
      docs-sync-key:
        description: SSH key used to sync documentation
        required: false

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      - name: 📦 Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: 🏗️ Build package
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: 🧪 Run unit tests
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      - name: 📦 Install and build
        working-directory: ${{ inputs.working-directory }}
        run: |
          ${{ inputs.install-command }}
          ${{ inputs.build-command }}

      - name: 🛑 Pre-publish validation
        env:
          INPUT_PACKAGE_NAME: ${{ inputs.package-name }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          PACKAGE_NAME="$INPUT_PACKAGE_NAME"
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME=$(node -p "require('./package.json').name")
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "Git Tag: ${{ github.ref_name }}, Package: $PACKAGE_NAME, Version: $PACKAGE_VERSION"

          if [ "v${PACKAGE_VERSION}" != "${{ github.ref_name }}" ]; then
            echo "❌ package.json version ($PACKAGE_VERSION) does not match tag (${{ github.ref_name }})" && exit 1
          fi

          PUBLISHED_VERSIONS=$(npm view "$PACKAGE_NAME" versions --json || true)
          if echo "$PUBLISHED_VERSIONS" | grep -q "\"$PACKAGE_VERSION\""; then
            echo "❌ Version $PACKAGE_VERSION already published to npm" && exit 1
          else
            echo "✅ Version $PACKAGE_VERSION is new; proceeding"
          fi

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

          DIST_TAG="latest"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            PRERELEASE_PART=${PACKAGE_VERSION#*-}
            DIST_TAG=${PRERELEASE_PART%%.*}
            if [ -z "$DIST_TAG" ]; then
              DIST_TAG="latest"
            fi
          fi

          echo "Detected dist-tag: $DIST_TAG"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      # Authentication is npm Trusted Publishing (OIDC), not a token. npm claims
      # the identity of this workflow from the `id-token: write` credential, so
      # NODE_AUTH_TOKEN must be *empty*: actions/setup-node writes an .npmrc with
      # an `${NODE_AUTH_TOKEN}` placeholder, and leaving a stale or invalid value
      # in it makes npm attempt token auth and fail. A failed-auth PUT to a scoped
      # package returns 404, not 401 — which is exactly how this repo's
      # v0.1.0-beta.1 publish failed.
      - name: 🚀 Publish package
        env:
          NODE_AUTH_TOKEN: ""
          DIST_TAG: ${{ env.DIST_TAG }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          npm install -g npm@11
          if [ "$DIST_TAG" = "latest" ]; then
            echo "Publishing with dist-tag: latest"
            npm publish --provenance --access public
          else
            echo "Publishing with dist-tag: $DIST_TAG"
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi

      - name: ✨ Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "This release was automatically published from CI."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync_docs:
    needs: publish
    if: ${{ inputs.sync-docs && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    env:
      DOCS_SYNC_KEY: ${{ secrets.docs-sync-key }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🔄 Sync Docs
        if: ${{ env.DOCS_SYNC_KEY != '' }}
        uses: ./.github/actions/sync-docs
        env:
          DOCS_SYNC_KEY: ${{ env.DOCS_SYNC_KEY }}

      - name: 📭 Docs sync skipped (no secret provided)
        if: ${{ env.DOCS_SYNC_KEY == '' }}
        run: echo "DOCS_SYNC_KEY not provided; skipping documentation sync."
